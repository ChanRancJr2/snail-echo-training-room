services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: echo_java
      MYSQL_USER: echo
      MYSQL_PASSWORD: ${JAVA_DB_PASSWORD:?Set JAVA_DB_PASSWORD for local development}
      MYSQL_RANDOM_ROOT_PASSWORD: 'yes'
    ports:
      - '127.0.0.1:${JAVA_DB_PORT:-13306}:3306'
    volumes:
      - java-mysql:/var/lib/mysql
    healthcheck:
      test: ['CMD-SHELL', 'mysql --user="$$MYSQL_USER" --password="$$MYSQL_PASSWORD" --database="$$MYSQL_DATABASE" --execute="SELECT 1" >/dev/null 2>&1']
      interval: 3s
      timeout: 3s
      retries: 30
  storage:
    profiles: [media]
    image: chrislusf/seaweedfs@sha256:c2658820e763294a9e9de7b36c81e59b879e3459148351aee4e31a126ca64860
    command: ['mini', '-dir=/data']
    environment:
      AWS_ACCESS_KEY_ID: ${JAVA_STORAGE_ACCESS_KEY:-}
      AWS_SECRET_ACCESS_KEY: ${JAVA_STORAGE_SECRET_KEY:-}
      S3_BUCKET: ${JAVA_STORAGE_BUCKET:-echo-java-private}
    ports:
      - '127.0.0.1:${JAVA_STORAGE_PORT:-18334}:8333'
    volumes:
      - java-storage:/data

volumes:
  java-mysql:
  java-storage:
