# Development and integration tests only. Production uses generated secrets and private networks.
services:
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: echo
      POSTGRES_USER: echo
      POSTGRES_PASSWORD: dev_only_change_me
    ports:
      - '127.0.0.1:15432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U echo -d echo']
      interval: 2s
      timeout: 2s
      retries: 20
  redis:
    image: redis:7.4-alpine
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    ports:
      - '127.0.0.1:16379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 2s
      retries: 20
  storage:
    image: chrislusf/seaweedfs@sha256:c2658820e763294a9e9de7b36c81e59b879e3459148351aee4e31a126ca64860
    command: ['mini', '-dir=/data']
    environment:
      AWS_ACCESS_KEY_ID: dev_echo_access
      AWS_SECRET_ACCESS_KEY: dev_echo_secret_only
      S3_BUCKET: echo-private
    ports:
      - '127.0.0.1:18333:8333'
